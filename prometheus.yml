global:
  scrape_interval: 15s  # Scrape every 15 seconds

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'  # Prometheus metrics endpoint exposed by Spring Boot Actuator
    static_configs:
      - targets: ['spring-boot-app:8081']  # Scrape metrics from Spring Boot app (use 8081)
